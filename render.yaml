# Render Blueprint — marfyl-backend
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: marfyl-backend
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && NODE_OPTIONS=--max-old-space-size=4096 pnpm build
    startCommand: pnpm prisma:deploy && pnpm start:prod
    healthCheckPath: /api/public/db-ping
    envVars:
      - key: NODE_ENV
        value: production
      # Usar connection string POOLED de Neon (sin channel_binding=require)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://marfyl-frontend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://marfyl.site,https://www.marfyl.site,https://marfyl-frontend.onrender.com
      - key: CONCERT_FEATURE_ENABLED
        value: "true"
      - key: CONCERT_AUTO_SETUP_MONDDY
        value: "true"
      - key: CONCERT_DEFAULT_SLUG
        value: hemenegilda-capacidad
      - key: CONCERT_PENDING_ORDER_HOURS
        value: "2"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      - key: RESEND_FROM_NAME
        value: MARFYL Entradas
      - key: CONCERT_OWNER_NOTIFY_EMAIL
        sync: false
      # LLM texto: Nemotron Ultra (NVIDIA NIM). OCR visión sigue en Groq/Gemini.
      - key: LLM_PROVIDER
        value: nvidia
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: NVIDIA_ENABLE_THINKING
        value: "false"
      - key: NVIDIA_TIMEOUT_MS
        value: "180000"
      - key: ASSISTANT_MAX_TOKENS
        value: "2048"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      # OCR facturas por foto (visión — no usar llama-3.1-8b-instant)
      - key: GROQ_VISION_MODEL
        value: meta-llama/llama-4-scout-17b-16e-instruct
      - key: GROQ_VISION_MODEL_FALLBACK
        value: meta-llama/llama-4-maverick-17b-128e-instruct
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: FISCAL_EMBEDDING_MODEL
        value: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - key: FISCAL_ADVISOR_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      # Marfyl AI — Asesor Fiscal Proactivo (RAG)
      - key: COHERE_API_KEY
        sync: false
      - key: MARFYL_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: MARFYL_TOP_K
        value: "3"
